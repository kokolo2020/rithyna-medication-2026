.btn:focus-visible,.nav-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.dir-tab:focus-visible,.directory-list summary:focus-visible{outline-color:var(--ring)}

const field=(label,id,type,value='',required=true)=>`<label>${fieldCaption(label,fieldIcon(id,type))}<input name="${id}" type="${type}" value="${escapeHTML(value)}" maxlength="100" ${required?'required':''}></label>`;
const noteField=(label,value='',required=false)=>`<label>${fieldCaption(label,'note')}<textarea name="note" rows="2" maxlength="220" ${required?'required':''}>${escapeHTML(value)}</textarea></label>`;
const selectField=(label,id,values,current)=>`<label>${fieldCaption(label,fieldIcon(id))}<select name="${id}">${values.map(v=>`<option ${v===current?'selected':''}>${escapeHTML(v)}</option>`).join('')}</select></label>`;
const demoTime=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
function slotAllowed(i){return state.actor===dosePlan[i][2]&&(state.actor==='Papa'||state.shift)}
function dateLabel(value){const d=value||demoDate;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return '';return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T00:00:00Z'))}
const actorName=()=>state.actor==='Papa'?'Papa':state.coverage;
const extraAllowed=x=>state.actor==='Papa'||(state.shift&&(!x||x.by===state.coverage));
const pastKey=(date,slot)=>date+'-'+slot;
const priorDemoDate=new Date(Date.parse(demoDate+'T00:00:00Z')-86400000).toISOString().slice(0,10);
function validPastDate(day){if(typeof day!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(day)||day>demoDate)return false;const at=new Date(day+'T00:00:00Z');return !Number.isNaN(at.getTime())&&at.toISOString().slice(0,10)===day}
function doseRecord(day,slot){return day===demoDate?state.done[slot]:state.pastDoses[pastKey(day,slot)]}
function scheduledRows(){const now=Object.entries(state.done).map(([slot,log])=>({day:demoDate,slot:Number(slot),log}));const before=Object.values(state.pastDoses).map(log=>({day:log.scheduledDate,slot:log.slot,log}));return [...now,...before].sort((a,b)=>b.day.localeCompare(a.day)||b.slot-a.slot)}
function renderScheduledRecords(){
 return scheduledRows().map(({day,slot,log})=>`<div class="row scheduled-record" tabindex="-1" id="dose-record-${pastKey(day,slot)}"><div><strong>${dosePlan[slot][1]}</strong><p class="small muted">Scheduled · ${dateLabel(day)} · ${dosePlan[slot][0]}</p><p class="small muted">${listMeds(log.items??plannedMeds(slot))}</p>${log.late?`<p class="small muted">${log.notGiven?'Not given':'Given by '+escapeHTML(log.givenBy)} · Logged by ${escapeHTML(log.loggedBy)}</p>`:`<p class="small muted">${escapeHTML(log.by)}${log.notGiven?' · Not given':''}</p>`}${log.note?`<p class="small muted record-note">${escapeHTML(log.note)}</p>`:''}</div><div class="record-actual">${log.notGiven?tag('Not given','amber'):`<span class="small muted">Actually given</span><strong>${escapeHTML(log.time||'')}</strong>${log.date&&log.date!==day?`<small>${dateLabel(log.date)}</small>`:''}`}</div></div>`).join('');
}
function reviewDose(day,slot){
 if(!validPastDate(day)||!doseRecord(day,slot))return;
 $('dialog').close();state.recTab='care';go('records');
 const row=$('dose-record-'+pastKey(day,slot));row?.focus({preventScroll:true});row?.scrollIntoView({block:'center'});
}
function pastDoseEntry(){
 const recentActor=actorName();
 const givenField=state.actor==='Papa'?selectField('Given by','givenBy',['Papa',...nurses],recentActor):`<div class="past-attribution">${fieldCaption('Given by:','people')} <span>${escapeHTML(recentActor)}</span></div>`;
 const slotField=`<label>${fieldCaption('Scheduled dose','capsule')}<select id="past-slot" name="slot" required><option value="">Select a time slot</option>${dosePlan.map(([t,name],i)=>`<option value="${i}">${t} · ${name}</option>`).join('')}</select></label>`;
 const fields=`<label>${fieldCaption('Scheduled date','calendar')}<input id="past-date" name="scheduledDate" type="date" max="${demoDate}" value="${priorDemoDate}" required></label>${slotField}
 <div id="past-summary" class="dose-sample past-summary" hidden></div><div id="past-existing" class="past-existing" role="status" hidden></div>
 <div class="edit-timing"><label>${fieldCaption('Actual date given','calendar')}<input id="past-actual-date" name="givenDate" type="date" max="${demoDate}" value="${priorDemoDate}" required></label>${field('Actual time given','givenTime','time')}</div>
 ${givenField}<div class="past-attribution">${fieldCaption('Logged by:','profile')} <span>${escapeHTML(recentActor)}</span></div>
 <label class="past-verify"><input type="checkbox" name="verified" value="yes" required><span>I verified these medications were already given.</span></label>
 <p class="past-note">Unconfirmed does not mean missed. This log is not a prompt to give another dose.</p>
 <p id="past-error" class="small med-error" role="alert"></p>`;
 issueDialog('Log a past dose','Demo dates only. Log only a dose already given.',fields,'Save past dose',data=>{
  const day=data.get('scheduledDate'),actual=data.get('givenDate'),givenTime=data.get('givenTime'),raw=data.get('slot'),slot=raw===''||raw===null?-1:Number(raw);
  if(!validPastDate(day)||!validPastDate(actual)||!Number.isInteger(slot)||!dosePlan[slot]||typeof givenTime!=='string'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(givenTime)||data.get('verified')!=='yes'){$('past-error').textContent='Check the dates and time, then verify the dose was already given.';return false}
  if(doseRecord(day,slot)){paintPast();return false}
  const givenBy=state.actor==='Papa'?data.get('givenBy'):actorName();
  if(!['Papa',...nurses].includes(givenBy)){$('past-error').textContent='Select who gave the dose.';return false}
  const items=pastItems(day,slot);
  const log={slot,scheduledDate:day,date:actual,time:givenTime,givenBy,loggedBy:actorName(),by:givenBy,items,late:true};
  if(day===demoDate){state.done[slot]=log;delete state.drafts[slot]}else state.pastDoses[pastKey(day,slot)]=log;
  notify('Past dose logged in the demo.');
 });
 const form=$('sheet-form'),dayField=$('past-date'),slotSelect=$('past-slot'),actualField=$('past-actual-date'),summary=$('past-summary'),existing=$('past-existing'),save=form.querySelector('button[type="submit"]'),verify=form.elements.verified;
 function pastItems(day,slot){const draft=day===demoDate?state.drafts[slot]:null;return draft?.items?.length?draft.items:plannedMeds(slot)}
 function paintPast(){
  const day=dayField.value,slot=slotSelect.value===''?-1:Number(slotSelect.value),valid=validPastDate(day)&&Boolean(dosePlan[slot]),old=valid&&doseRecord(day,slot);
  summary.hidden=!valid||Boolean(old);summary.innerHTML=valid&&!old?listMeds(pastItems(day,slot)):'';
  existing.hidden=!old;existing.innerHTML=old?`<strong>This slot already has an entry.</strong>${button('Review existing entry','past-review-'+pastKey(day,slot),'','history')}`:'';
  save.disabled=Boolean(old);$('past-error').textContent='';
 }
 form.addEventListener('change',e=>{
  if(e.target===dayField){actualField.value=dayField.value;verify.checked=false;paintPast()}
  else if(e.target===slotSelect){verify.checked=false;paintPast()}
  else if(e.target===actualField||e.target.name==='givenTime'||e.target.name==='givenBy'){verify.checked=false}
 });
 paintPast();
}
function doseEntry(i,editing){
  if(!dosePlan[i]||!slotAllowed(i))return;
  const old=state.done[i],draft=state.drafts[i],item=old??draft??{items:plannedMeds(i)},items=item.items??plannedMeds(i);
  if(editing){
    editMedicationList({title:'Edit medication entry',description:'Scheduled slot: '+dosePlan[i][0]+' · '+dateLabel(demoDate)+'. Changes apply to this entry only, not tomorrow’s schedule.',items,date:item.date,time:item.time,note:item.note,allowEmpty:true,saveLabel:old?'Save entry':'Save for review',onSave:values=>{
      if(!slotAllowed(i))return false;
      if(!values.items.length){state.done[i]={...old,...values,by:old?.by??actorName(),notGiven:true,edited:true};delete state.drafts[i];notify('Marked not given in the demo. No dose was confirmed.');return}
      if(old&&!old.notGiven){state.done[i]={...old,...values,by:old.by,edited:true};notify('Demo entry updated. Daily schedule unchanged.');return}
      delete state.done[i];state.drafts[i]=values;notify('Saved for review. No dose was confirmed.');
    }});
    return;
  }
  if(old||!items.length)return;
  issueDialog('Confirm given','Only confirm once these medications were given. Demo only.',`<div class="dose-sample">${dosePlan[i][0]} · ${listMeds(items)}</div>`+field('Actual date','date','date',item.date||demoDate)+field('Actual time','time','time',item.time||demoTime()),'Confirm given',data=>{
    if(!slotAllowed(i)||state.done[i]){notify('This slot can’t be confirmed again.');return}
    state.done[i]={items,date:data.get('date'),time:data.get('time'),note:item.note||'',by:actorName()};delete state.drafts[i];notify('Demo entry saved.');
  });
}
function extraEntry(i){const old=i===undefined?null:state.extras[i];if((i!==undefined&&!old)||!extraAllowed(old))return;
  editMedicationList({title:old?'Edit extra medication':'Log extra medication',description:'This one-off demo entry does not change the standing schedule.',items:old?.items??[],date:old?.date,time:old?.time,note:old?.note,allowEmpty:false,saveLabel:old?'Save entry':'Save extra entry',onSave:values=>{
    if(!extraAllowed(old))return false;
    const record={...values,by:old?.by||actorName()};if(old)state.extras[i]=record;else state.extras.push(record);
    notify(old?'Demo extra entry updated.':'Demo extra entry saved. See Records.');
  }});
}
function editMedicationList({title,description,items,date,time,note,allowEmpty,saveLabel,onSave}){
  const rows=items.map(({name,amount})=>({name,amount}));let isAdding=false;
  const fields=`<div class="edit-timing">${field('Actual date','date','date',date||demoDate)}<div>${field('Actual time','time','time',time||demoTime())}<button type="button" class="btn time-preset" data-med-action="now">${icon('clock')}Current time</button></div></div>
  <div class="med-editor"><div class="med-editor-head"><h3 id="editing-meds">Medications</h3><span class="small muted" id="med-count" aria-live="polite"></span></div><div id="med-list" class="med-list" aria-labelledby="editing-meds"></div><div id="med-add"></div><p id="med-error" class="small med-error" role="alert"></p></div>${noteField('Note (optional)',note)}`;
  issueDialog(title,description,fields,saveLabel,data=>{
    if(!rows.length&&!allowEmpty){$('med-error').textContent='Add at least one medication before saving.';return false}
    if(rows.some(x=>!x.amount.trim())){$('med-error').textContent='Enter an amount for each medication.';return false}
    return onSave({items:rows.map(x=>({name:x.name,amount:x.amount.trim()})),date:data.get('date'),time:data.get('time'),note:String(data.get('note')||'').trim()});
  });
  const form=$('sheet-form');
  function paint(){
    $('med-count').textContent=rows.length+' '+(rows.length===1?'item':'items');
    $('med-list').innerHTML=rows.length?rows.map(({name,amount},i)=>`<div class="med-row"><span class="med-name">${fieldCaption(escapeHTML(name),'capsule')}</span><label class="med-amount">${fieldCaption('Amount','measure')}<input data-med-amount="${i}" aria-label="Amount for ${escapeHTML(name)}" value="${escapeHTML(amount)}" maxlength="70" required></label><button type="button" class="btn med-remove" data-med-action="remove" data-med-row="${i}" aria-label="Remove ${escapeHTML(name)}">${icon('trash')}Remove</button></div>`).join(''):`<div class="med-empty">No medications selected. ${allowEmpty?'Add one, or save explicitly as not given.':'Add a medication to continue.'}</div>`;
    const left=medCatalog.filter(name=>!rows.some(x=>x.name===name));
    $('med-add').innerHTML=isAdding?`<div class="med-picker"><label>${fieldCaption('Choose a medication','capsule')}<select id="med-picker"><option value="">Select from the demo list</option>${left.map(name=>`<option>${escapeHTML(name)}</option>`).join('')}</select></label><div class="actions"><button class="btn primary" type="button" data-med-action="add-selected" disabled>Add</button><button class="btn" type="button" data-med-action="close-add">Cancel add</button></div></div>`:`<button type="button" class="btn med-add-btn" data-med-action="open-add" ${left.length?'':'disabled'}>${icon('plus')}Add medication</button>`;
    form.querySelector('button[type="submit"]').textContent=allowEmpty&&!rows.length?'Save as not given':saveLabel;
  }
  form.addEventListener('input',event=>{const i=event.target.dataset.medAmount;if(i!==undefined&&rows[i]){rows[i].amount=event.target.value;$('med-error').textContent=''}});
  form.addEventListener('change',event=>{if(event.target.id!=='med-picker')return;form.querySelector('[data-med-action="add-selected"]').disabled=!event.target.value;});
  form.addEventListener('click',event=>{const control=event.target.closest('[data-med-action]');if(!control)return;
    $('med-error').textContent='';
    if(control.dataset.medAction==='now'){form.elements.time.value=demoTime();return}
    if(control.dataset.medAction==='remove'){rows.splice(Number(control.dataset.medRow),1);paint();(form.querySelector('[data-med-action="remove"]')||form.querySelector('[data-med-action="open-add"]'))?.focus();return}
    if(control.dataset.medAction==='open-add'){isAdding=true;paint();$('med-picker').focus();return}
    if(control.dataset.medAction==='close-add'){isAdding=false;paint();form.querySelector('[data-med-action="open-add"]')?.focus();return}
    if(control.dataset.medAction==='add-selected'){const name=$('med-picker').value;if(!medCatalog.includes(name)||rows.some(x=>x.name===name))return;
      rows.push({name,amount:''});isAdding=false;paint();form.querySelector(`[data-med-amount="${rows.length-1}"]`)?.focus();
    }
  });
  paint();
}
function therapyEntry(i){const v=visits[i];if(!v||state.therapy.some(t=>t.id===i))return;issueDialog('Log therapy session','Confirm when the session actually took place and add an example activity note.',`<div class="dose-sample">${v.day} ${v.month} · ${v.title} · ${v.where}</div>`+field('Actual time','actual','time',i===0?'11:00':'10:30')+noteField('Session activity', '', true),'Save demo session',data=>{const note=String(data.get('note')).trim();if(!note){notify('Enter an example activity.');return false}state.therapy.push({id:i,note,actual:data.get('actual')});notify('Demo therapy session saved.')})}
document.addEventListener('click',e=>{const contact=e.target.closest('[data-contact]');if(contact&&!contact.parentElement.open){const id=Number(contact.dataset.contact);state.recent=[id,...state.recent.filter(i=>i!==id)]}const nav=e.target.closest('[data-view]');if(nav){go(nav.dataset.view);return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;
if(a==='close')$('dialog').close();
else if(a.startsWith('photo-pick-')&&state.actor==='Papa'){const id=a.slice(11);if(getPhotoProfile(id))$('profile-photo-'+id)?.click()}
else if(a.startsWith('photo-remove-')&&state.actor==='Papa'){const key=getPhotoProfile(a.slice(13))?.key;if(key&&state.photos[key]){photoJobs.delete(key);URL.revokeObjectURL(state.photos[key]);delete state.photos[key];render();notify('Demo photo removed.')}}
else if(a==='extra')extraEntry();
else if(a==='past-dose')pastDoseEntry();
else if(a.startsWith('past-review-')){const m=/^past-review-(\d{4}-\d{2}-\d{2})-(\d+)$/.exec(a);if(m)reviewDose(m[1],Number(m[2]))}
else if(a==='new-message')composeMessage();
else if(a==='appointment-add')appointmentEditor();
else if(a.startsWith('appointment-edit-'))appointmentEditor(Number(a.slice(17)));
else if(a.startsWith('extra-edit-'))extraEntry(Number(a.slice(11)));
else if(a.startsWith('open-'))go(a.slice(5));
else if(a.startsWith('profile-edit-'))profileEdit(a.slice(13));
else if(a==='profile-reports'){state.recTab='insights';go('records')}
else if(a.startsWith('give-'))doseEntry(Number(a.slice(5)),false);
else if(a.startsWith('edit-')&&a!=='edit-roster')doseEntry(Number(a.slice(5)),true);
else if(a.startsWith('therapy-'))therapyEntry(Number(a.slice(8)));
else if(a.startsWith('contacts-')){state.contactTab=a.slice(9);render();document.querySelector(`[data-action="${a}"]`)?.focus()}
else if(a.startsWith('favorite-')){const i=Number(a.slice(9)),has=state.favorites.includes(i);state.favorites=has?state.favorites.filter(x=>x!==i):[...state.favorites,i];const row=e.target.closest('details');if(has&&state.contactTab==='favorites'){row?.remove();if(!getContacts().length)$('contact-results').innerHTML=contactCards([]);document.querySelector('[data-action="contacts-favorites"]')?.focus()}else e.target.closest('button').innerHTML=icon('star')+(has?'Add favorite':'Remove favorite');notify(has?'Removed from demo favorites.':'Added to demo favorites.')}
else if(a.startsWith('rec-')){state.recTab=a.slice(4);render()}
else if(a==='shift'&&state.actor==='Nurse'&&!state.pending){state.shift=true;render();notify('Demo shift confirmed on this device.')}
else if(a==='swap'&&state.actor==='Nurse'){issueDialog('Request a cover swap','Papa must approve the replacement before the new nurse checks in.',selectField('Replacement','nurse',nurses.filter(n=>n!==state.coverage)),'Send demo request',data=>{state.pending=data.get('nurse');notify('Demo request saved. No message sent.')})}
else if(a==='approve'&&state.actor==='Papa'&&state.pending){state.coverage=state.pending;state.pending='';state.shift=false;render();notify('Demo swap approved. The new nurse must check in.')}
else if(a==='edit-roster'&&state.actor==='Papa'){issueDialog('Edit demo roster','This changes only the demo assignment for Tuesday.',selectField('Tuesday’s nurse','nurse',nurses,state.coverage),'Save assignment',data=>{const nurse=data.get('nurse');if(state.coverage!==nurse){state.coverage=nurse;state.shift=false;state.pending=''}notify('Demo roster saved.')})}
});
$('sidebar-toggle').addEventListener('click',e=>{
 const open=e.currentTarget.getAttribute('aria-expanded')!=='true';
 $('app-frame').dataset.sidebar=open?'open':'closed';
 const label=open?'Hide navigation':'Show navigation';
 e.currentTarget.setAttribute('aria-expanded',String(open));
 e.currentTarget.setAttribute('aria-label',label);
 e.currentTarget.title=label;
});
$('theme-button').addEventListener('click',themeDialog);
$('role-button').addEventListener('click',()=>{issueDialog('Preview as a caregiver','Switch demo views to try a handoff. This is not a real sign-in.',selectField('Caregiver view','role',['Papa','Nurse'],state.actor),'Switch view',data=>{state.actor=data.get('role');notify('Previewing '+(state.actor==='Papa'?'Papa':'nurse')+' view.')})});
document.addEventListener('input',e=>{if(e.target.id!=='contact-search')return;state.contactFilter=e.target.value;$('contact-results').innerHTML=contactCards(getContacts())});
document.addEventListener('change',e=>{
  if(e.target.dataset.photoProfile===undefined||state.actor!=='Papa')return;
  const key=getPhotoProfile(e.target.dataset.photoProfile)?.key,file=e.target.files?.[0];e.target.value='';
  if(!key||!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>4*1024*1024){notify('Choose a JPEG, PNG, or WebP image up to 4 MB.');return}
  const job={},url=URL.createObjectURL(file),image=new Image();photoJobs.set(key,job);
  image.onerror=()=>{URL.revokeObjectURL(url);if(photoJobs.get(key)===job){photoJobs.delete(key);notify('This image couldn’t be opened. Try another photo.')}};
  image.onload=()=>{if(photoJobs.get(key)!==job||state.actor!=='Papa'){URL.revokeObjectURL(url);if(photoJobs.get(key)===job)photoJobs.delete(key);return}
    photoJobs.delete(key);
    if(!image.naturalWidth||!image.naturalHeight||Math.max(image.naturalWidth,image.naturalHeight)>8192){URL.revokeObjectURL(url);notify('Choose a photo no larger than 8192 pixels per side.');return}
    if(state.photos[key])URL.revokeObjectURL(state.photos[key]);state.photos[key]=url;render();notify('Demo photo added on this device only.');
  };image.src=url;
});
let storedTheme;try{storedTheme=localStorage.getItem(themeKey)}catch{}
applyTheme(storedTheme);render();
setInterval(updateHeroClock,1000);
</script></body></html>
