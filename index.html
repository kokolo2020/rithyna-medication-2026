<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d247c">
<meta name="robots" content="noindex,nofollow">
<title>iCare · Sign-in test</title>
<link rel="stylesheet" href="./assets/care.css">
<script defer src="./assets/care.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
 <symbol id="heart" viewBox="0 0 24 24"><path d="M20.6 5a5 5 0 0 0-7.1 0L12 6.5 10.5 5a5 5 0 0 0-7.1 7.1l8.6 8.4 8.6-8.4a5 5 0 0 0 0-7.1Z"/><path d="M5.5 12h3l1.5-3 2.2 6 1.8-3h4"/></symbol>
 <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
 <symbol id="history" viewBox="0 0 24 24"><path d="M3 9a9 9 0 1 1 1.7 9.2M3 4v5h5m4-2v5l3 2"/></symbol>
 <symbol id="shield" viewBox="0 0 24 24"><path d="M12 22s8-3 8-11V5l-8-3-8 3v6c0 8 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></symbol>
 <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
 <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/></symbol>
 <symbol id="pill" viewBox="0 0 24 24"><path d="M20 4a5 5 0 0 0-7 0l-9 9a5 5 0 0 0 7 7l9-9a5 5 0 0 0 0-7Zm-11 4 7 7"/></symbol>
 <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
 <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="logout" viewBox="0 0 24 24"><path d="M12 4H5v16h7m0-8h9m-4-4 4 4-4 4"/></symbol>
 <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
 <symbol id="note" viewBox="0 0 24 24"><path d="M6 3h12l3 3v15H3V3h3Zm2 6h8m-8 4h8m-8 4h4"/></symbol>
 <symbol id="menu" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m6-11-3 3 3 3"/></symbol>
 <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5m-4-2a8 8 0 0 1 13-4l2 2M4 16l2 2a8 8 0 0 0 13-4"/></symbol>
</svg>
<div id="app-shell" class="shell">
<header class="top">
 <div class="top-brand"><button id="toggle-nav" class="icon-button hide-mobile" type="button" aria-label="Hide menu" aria-controls="sidebar" aria-expanded="true" hidden><svg class="icon" aria-hidden="true"><use href="#menu"></use></svg></button>
 <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#heart"></use></svg></span>
 <div class="brand-type"><strong>iCare</strong><span>v9 · Test workspace</span></div></div>
 <div id="session-nav" class="session-nav" hidden></div>
</header>
<aside id="sidebar" class="sidebar" hidden>
 <div class="side-section">CARE WORKSPACE</div>
 <nav aria-label="Care workspace">
  <button type="button" data-route="today"><svg class="icon" aria-hidden="true"><use href="#sun"></use></svg>Today</button>
  <button type="button" data-route="records"><svg class="icon" aria-hidden="true"><use href="#history"></use></svg>Records</button>
  <button type="button" data-route="notes" hidden><svg class="icon" aria-hidden="true"><use href="#note"></use></svg>Notes</button>
 </nav>
 <div class="side-footer"><svg class="icon" aria-hidden="true"><use href="#shield"></use></svg><span>Team sign-in required</span></div>
</aside>
<main id="main" class="main">
 <div id="notice" class="notice" aria-live="polite" hidden></div>
 <section id="signin" class="signin">
  <div class="welcome"><span class="eyebrow">PRIVATE CARE WORKSPACE</span><h1>Better care,<br>together.</h1><p>A shared view of what was given, when, and by whom.</p><div class="welcome-emblem" aria-hidden="true"><svg class="icon"><use href="#heart"></use></svg></div></div>
  <form id="login-form" class="card login-card">
   <div class="tile purple"><svg class="icon" aria-hidden="true"><use href="#shield"></use></svg></div>
   <h2>Sign in</h2><p class="muted">Test workspace only. Use your test name and PIN. Do not enter real care information.</p>
   <label for="email">Name</label><input id="email" name="email" type="text" autocomplete="username" required>
   <label for="password">PIN</label><input id="password" name="password" type="password" inputmode="numeric" autocomplete="off" required>
   <p id="login-error" class="error" role="alert" hidden></p>
   <button id="login-submit" class="button primary" type="submit">Sign in</button>
  </form>
 </section>
 <section id="workspace" hidden></section>
</main>
<nav id="mobile-nav" aria-label="Care workspace mobile" hidden>
 <button type="button" data-route="today"><svg class="icon" aria-hidden="true"><use href="#sun"></use></svg>Today</button>
 <button type="button" data-route="records"><svg class="icon" aria-hidden="true"><use href="#history"></use></svg>Records</button>
  <button type="button" data-route="notes" hidden><svg class="icon" aria-hidden="true"><use href="#note"></use></svg>Notes</button>
</nav>
</div>
<dialog id="record-dialog" aria-labelledby="record-title"></dialog>
<noscript>This app needs JavaScript to sign in and display records.</noscript>
</body>
</html>
