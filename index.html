<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#006b6f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Rithyna Medication 2026</title><style>
:root{--teal:#006b6f;--mint:#eaf7f5;--ink:#17383d;--muted:#71888c;--line:#dce9e7;--yellow:#fff1a8;--red:#ffd8d8;--alarm:#d71920}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#005d61 0 210px,#eef7f6 210px);color:var(--ink);min-height:100vh}.app{max-width:1150px;margin:auto;padding:16px 12px 60px}.brand{color:white;font-weight:900;letter-spacing:.12em;margin:5px 0 16px}.hero,.card{background:#fff;border-radius:26px;box-shadow:0 14px 40px #00484c18}.hero{padding:24px 28px;margin-bottom:18px;background:linear-gradient(135deg,#fff,#eaf8f6)}h1{margin:4px 0;font-size:clamp(28px,5vw,44px)}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.card{overflow:hidden}.head{padding:18px 20px;border-bottom:1px solid #edf3f2}.form{padding:4px 20px 22px}label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;color:#506c70;margin:14px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fbfefe}textarea{min-height:75px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle button,.add{padding:10px;border-radius:999px;border:1px solid var(--line);background:#f7fbfb;font-weight:800}.toggle .on{background:#0aa5a3;color:#fff}.medrow{display:grid;grid-template-columns:1.45fr 1fr 38px;gap:7px;padding:9px;background:#f7fbfb;border:1px solid var(--line);border-radius:15px;margin-bottom:8px}.medrow button{border:0;border-radius:10px;background:#fff0f0;color:#c33}.add{width:100%;color:#087a7d;border-style:dashed}.save{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#08a1a3,#17b4aa);color:white;font-weight:900;margin-top:15px}.tools{padding:12px 16px;text-align:right}.tools button{padding:8px 11px;border:1px solid var(--line);background:white;border-radius:999px;font-weight:700}.table{overflow:auto;padding:0 14px 18px}table{width:100%;border-collapse:collapse;min-width:700px}th{padding:11px;text-align:left;font-size:11px;text-transform:uppercase;background:#e8f5f3}td{padding:13px 11px;border-bottom:1px solid #e8efee;vertical-align:top}.time{font-size:17px;font-weight:900}.date{font-size:11px;color:var(--muted)}.tag{display:block;width:max-content;max-width:280px;background:#e7f5f3;color:#075e62;border-radius:999px;padding:5px 8px;margin-bottom:5px;font-weight:750}.temp{font-weight:900;border-radius:10px}.warn{background:var(--yellow)}.high{background:var(--red);color:#a22}.alarm{background:var(--alarm);color:#fff;animation:p .65s infinite alternate}@keyframes p{to{transform:scale(1.04)}}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:820px){.grid{grid-template-columns:1fr}.hero{padding:20px}.app{padding:10px}.medrow{grid-template-columns:1fr 1fr 38px}.medrow select{grid-column:1/-1}}
</style></head><body><main class="app"><div class="brand">RITHYNA · 2026</div><section class="hero"><div style="font-size:12px;font-weight:900;color:#0b9d9d;letter-spacing:.18em">MEDICATION LOG</div><h1>Rithyna Medication 2026</h1><div class="sub">Clean medication, temperature & notes record · phone · iPad · computer</div></section><div class="grid"><section class="card"><div class="head"><b>Add medication</b></div><div class="form"><label>Date</label><input id="date" type="date"><label>Time</label><div class="toggle"><button id="now" class="on">Current time</button><button id="choose">Choose time</button></div><input id="time" type="time" disabled style="margin-top:8px"><label>Medication & dose</label><div id="meds"></div><button id="add" class="add">+ Add another medication at this time</button><div class="row"><div><label>Temp °C</label><input id="temp" type="number" step="0.1" inputmode="decimal" placeholder="37.2"></div><div><label>Note</label><input id="note" placeholder="Optional"></div></div><button id="save" class="save">Save entry</button></div></section><section class="card"><div class="head"><b>Medication history</b><div class="sub" style="font-size:12px;margin-top:5px">37.5–37.9°C yellow · 38.0–38.9°C red · 39.0°C+ alarm</div></div><div class="tools"><button id="export">Export CSV</button></div><div id="history" class="table"></div></section></div></main><script>
const catalog=[['Keppra 500mg','1.5 tablets'],['Depakin 200mg','3 ml'],['Lamictal 150mg','1 tablet'],['Fycompa 4mg','2 tablets'],['Valdoxan 25mg','1 tablet'],['Legalon 140mg','1 tablet'],['Euthyrox 50µg','1 tablet'],['Tylenol 500mg','1 tablet'],['Ibuprofen 400mg','1 tablet'],['Molnupiravir 200mg','4 capsules'],['Rotuss (Ropect)','1 capsule'],['Bilaxten 20mg','1 tablet'],['Difflam Forte 0.3%','1 spray'],['Nasonex','1 spray each nose'],['NAC Long 600mg','2 tablets']];const $=x=>document.getElementById(x),key='rithyna-medication-2026-v1';let useNow=true;function localDate(d=new Date()){let z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,10)}function nowTime(){return new Date().toTimeString().slice(0,5)}$('date').value=localDate();$('time').value=nowTime();function medRow(i=0){let d=document.createElement('div');d.className='medrow';d.innerHTML=`<select>${catalog.map((m,n)=>`<option value="${n}" ${n==i?'selected':''}>${m[0]}</option>`).join('')}</select><input value="${catalog[i][1]}"><button type="button">×</button>`;let s=d.querySelector('select'),inp=d.querySelector('input');s.onchange=()=>inp.value=catalog[+s.value][1];d.querySelector('button').onclick=()=>document.querySelectorAll('.medrow').length>1?d.remove():0;$('meds').appendChild(d)}medRow();$('add').onclick=()=>medRow();$('now').onclick=()=>{useNow=true;$('now').classList.add('on');$('choose').classList.remove('on');$('time').disabled=true;$('time').value=nowTime()};$('choose').onclick=()=>{useNow=false;$('choose').classList.add('on');$('now').classList.remove('on');$('time').disabled=false};function load(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function store(x){localStorage.setItem(key,JSON.stringify(x))}function tc(v){v=+v;if(!v)return'';return v>=39?'alarm':v>=38?'high':v>37.4?'warn':''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let a=load().sort((x,y)=>y.ts-x.ts);if(!a.length){$('history').innerHTML='<div class="empty">No medication entries yet.</div>';return}$('history').innerHTML=`<table><thead><tr><th>Time</th><th>Medication</th><th>Dose</th><th>Temp</th><th>Note</th></tr></thead><tbody>${a.map(e=>`<tr><td><div class="time">${e.time}</div><div class="date">${e.date}</div></td><td>${e.items.map(m=>`<span class="tag">${esc(m.name)}</span>`).join('')}</td><td>${e.items.map(m=>`<div style="margin:5px 0 10px">${esc(m.dose)}</div>`).join('')}</td><td class="temp ${tc(e.temp)}">${e.temp?esc(e.temp)+' °C':'—'}</td><td>${esc(e.note||'—')}</td></tr>`).join('')}</tbody></table>`}render();$('save').onclick=()=>{let date=$('date').value,time=useNow?nowTime():$('time').value;if(!date||!time)return alert('Choose date and time');let items=[...document.querySelectorAll('.medrow')].map(r=>({name:catalog[+r.querySelector('select').value][0],dose:r.querySelector('input').value}));let e={date,time,ts:new Date(date+'T'+time).getTime(),items,temp:$('temp').value,note:$('note').value};let a=load();a.push(e);store(a);if(+e.temp>=39){try{navigator.vibrate?.([300,150,300]);alert('HIGH TEMPERATURE: '+e.temp+' °C')}catch{}}$('temp').value='';$('note').value='';$('meds').innerHTML='';medRow();render()};$('export').onclick=()=>{let rows=[['Date','Time','Medication','Dose','Temp','Note']];load().forEach(e=>e.items.forEach((m,i)=>rows.push([e.date,e.time,m.name,m.dose,i? '':e.temp,i?'':e.note])));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rithyna-medication-2026.csv';a.click()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
