<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006b6f"><title>Rithyna Care Photos</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#005d61 0 210px,#eef7f6 210px);color:#17383d}.app{max-width:1180px;margin:auto;padding:16px}.top{color:white;font-weight:900;letter-spacing:.12em;margin:8px 0 14px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs a{color:white;text-decoration:none;border:1px solid #ffffff55;border-radius:14px;padding:10px 14px;font-weight:850}.tabs .on{background:white;color:#087477}.hero,.card{background:white;border-radius:24px;box-shadow:0 14px 40px #00484c18}.hero{padding:22px;margin-bottom:18px}h1{margin:0;font-size:clamp(28px,5vw,42px)}.sub{color:#71888c;margin-top:6px}.card{padding:18px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.photo{border:1px solid #dce9e7;border-radius:18px;overflow:hidden;background:#fbfefe}.photo img{width:100%;height:180px;object-fit:cover;display:block;cursor:zoom-in}.meta{padding:11px}.meta b{display:block}.meta small{color:#71888c}.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.actions button{flex:1;border-radius:10px;padding:8px 9px;font-weight:850}.replace,.add{border:1px solid #b9dfda;background:#eefaf8;color:#087477}.download{border:1px solid #c9ddf2;background:#eef6ff;color:#245d8c}.del{border:1px solid #ffd0d0;background:#fff;color:#a22}.empty{text-align:center;color:#71888c;padding:60px 15px}.gate{position:fixed;inset:0;background:#005d61;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.login{background:white;width:min(390px,100%);padding:24px;border-radius:24px}.login select,.login input,.login button{width:100%;padding:12px;margin-top:9px;border:1px solid #dce9e7;border-radius:12px}.login button{background:#0aa5a3;color:white;font-weight:900;border:0}.hide{display:none}.viewer{position:fixed;inset:0;z-index:50;background:#000e;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}.viewer.hide{display:none}.viewer img{max-width:95vw;max-height:88vh;width:auto;height:auto;object-fit:contain;transform-origin:center;transition:transform .15s}.viewer-tools{position:fixed;top:14px;right:14px;display:flex;gap:8px}.viewer-tools button{width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#17383d;font-size:21px;font-weight:900}.viewer-tools .viewer-download{width:auto;border-radius:999px;padding:0 15px;font-size:14px;color:#245d8c}.photo-source{position:fixed;inset:0;z-index:60;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px}.source-card{background:#fff;width:min(360px,100%);padding:18px;border-radius:20px}.source-card button{width:100%;padding:12px;margin-top:8px;border-radius:12px;font-weight:900}.source-card .primary{background:#0aa5a3;color:#fff;border:0}.source-card .secondary{background:#eefaf8;color:#087477;border:1px solid #b9dfda}</style></head><body><div id="gate" class="gate"><div class="login"><h2>Care Photos</h2><div class="sub">Sign in to view Rithyna's care photos.</div><select id="name"><option>Noni</option><option>Pan</option><option>Fon</option><option>Fah</option><option>Liew</option><option>Papa</option></select><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button id="login">Sign in</button><div id="err"></div></div></div><div id="viewer" class="viewer hide"><img id="viewerImg" alt="Care photo"><div class="viewer-tools"><button id="viewerDownload" class="viewer-download" title="Download">↓ Download</button><button id="zoomOut" title="Zoom out">−</button><button id="zoomIn" title="Zoom in">+</button><button id="viewerClose" title="Close">×</button></div></div><main class="app"><div class="top">RITHYNA · 2026</div><nav class="tabs"><a href="./index.html">Medication</a><a href="./blood-tests.html">Blood Tests</a><a class="on" href="./photos.html">Photos</a></nav><section class="hero"><h1>Care Photos</h1><div class="sub">Up to 3 photos per medication or care entry · tap a photo to view or download</div></section><section class="card"><div id="gallery" class="gallery"><div class="empty">Loading photos…</div></div></section></main><script>const API='/.netlify/functions/',KEY='rithyna-secure-session-v23',MAX=3;let auth=null,allPhotos=[],zoom=1,currentViewer={url:'',name:''};function token(){return auth?.token||''}async function call(method,body){const r=await fetch(API+'photo-api',{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function openPhoto(name,img){try{const d=await call('PUT',{name});img.src=d.url;return d.url}catch{}}function safeName(name){const raw=(name||'care-photo.jpg').split('__').pop()||'care-photo.jpg';return raw.replace(/[^a-zA-Z0-9._-]/g,'_')}async function downloadPhoto(url,name,btn){if(!url)return;const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='Downloading…'}try{const r=await fetch(url);if(!r.ok)throw Error('Could not download photo.');const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=safeName(name);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert(e.message||'Download failed.')}finally{if(btn){btn.disabled=false;btn.textContent=old||'↓ Download'}}}function pick(mode,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';if(mode==='camera')i.capture='environment';i.style.display='none';i.onchange=()=>{const f=i.files?.[0];if(f)cb(f);i.remove()};document.body.appendChild(i);i.click()}function choosePhoto(cb){const d=document.createElement('div');d.className='photo-source';d.innerHTML='<div class="source-card"><h3>Add photo</h3><div class="sub">Take a new photo or upload one from this device.</div><button class="primary">📷 Take Photo</button><button class="secondary">🖼️ Upload Photo</button><button class="secondary">Cancel</button></div>';document.body.appendChild(d);const b=d.querySelectorAll('button');b[0].onclick=()=>{d.remove();pick('camera',cb)};b[1].onclick=()=>{d.remove();pick('upload',cb)};b[2].onclick=()=>d.remove()}function upload(entry,file){return new Promise((resolve,reject)=>{if(file.size>6*1024*1024){reject(Error('Photo must be under 6 MB.'));return}const rd=new FileReader();rd.onerror=()=>reject(Error('Could not read photo.'));rd.onload=()=>call('POST',{entryId:entry,name:file.name,type:file.type||'image/jpeg',data:rd.result}).then(resolve,reject);rd.readAsDataURL(file)})}async function addPhoto(entry,btn){const count=allPhotos.filter(x=>x.name.split('__')[0]===entry).length;if(count>=MAX){alert('This entry already has 3 photos.');return}choosePhoto(async file=>{btn.disabled=true;btn.textContent='Uploading…';try{await upload(entry,file);await load()}catch(e){alert(e.message);btn.disabled=false;btn.textContent='Add Photo'}})}async function replacePhoto(p,btn){if(auth.role!=='admin')return;const entry=p.name.split('__')[0];choosePhoto(async file=>{btn.disabled=true;btn.textContent='Replacing…';try{await upload(entry,file);await call('DELETE',{name:p.name});await load()}catch(e){alert(e.message);btn.disabled=false;btn.textContent='Replace'}})}function showViewer(url,name){zoom=1;currentViewer={url,name};const v=document.getElementById('viewer'),im=document.getElementById('viewerImg');im.src=url;im.style.transform='scale(1)';v.classList.remove('hide')}document.getElementById('viewerClose').onclick=()=>document.getElementById('viewer').classList.add('hide');document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(4,zoom+.25);document.getElementById('viewerImg').style.transform=`scale(${zoom})`};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.5,zoom-.25);document.getElementById('viewerImg').style.transform=`scale(${zoom})`};document.getElementById('viewerDownload').onclick=e=>downloadPhoto(currentViewer.url,currentViewer.name,e.currentTarget);document.getElementById('viewer').onclick=e=>{if(e.target.id==='viewer')e.currentTarget.classList.add('hide')};async function load(){const d=await call('GET');allPhotos=d.photos||[];const g=document.getElementById('gallery');const wanted=new URLSearchParams(location.search).get('entry');let photos=allPhotos;if(wanted)photos=photos.filter(p=>p.name.split('__')[0]===wanted);if(!photos.length){g.innerHTML='<div class="empty">'+(wanted?'No photo attached to this entry.':'No care photos yet.')+(wanted?'<br><button id="emptyAdd" class="add" style="margin-top:14px;padding:10px 16px;border-radius:12px;font-weight:900">＋ Add Photo</button>':'')+'</div>';document.getElementById('emptyAdd')?.addEventListener('click',e=>addPhoto(wanted,e.currentTarget));return}g.innerHTML='';const counts={};photos.forEach(p=>{const entry=p.name.split('__')[0];counts[entry]=(counts[entry]||0)+1});photos.forEach(p=>{const parts=p.name.split('__'),entry=parts[0],owner=decodeURIComponent(parts[2]||'');const el=document.createElement('article');el.className='photo';const canAdd=(counts[entry]||0)<MAX;el.innerHTML='<img alt="Care photo"><div class="meta"><b>Entry '+entry.slice(-8)+' · '+(counts[entry]||1)+'/3</b><small>'+owner+' · '+new Date(p.created_at).toLocaleString()+'</small><div class="actions"><button class="download">↓ Download</button>'+(auth.role==='admin'?'<button class="replace">Replace</button>'+(canAdd?'<button class="add">＋ Add</button>':'')+'<button class="del">Delete</button>':'')+'</div></div>';g.appendChild(el);const img=el.querySelector('img');openPhoto(p.name,img).then(url=>{if(url){img.onclick=()=>showViewer(url,p.name);el.querySelector('.download').onclick=e=>downloadPhoto(url,p.name,e.currentTarget)}});el.querySelector('.replace')?.addEventListener('click',()=>replacePhoto(p,el.querySelector('.replace')));el.querySelector('.add')?.addEventListener('click',()=>addPhoto(entry,el.querySelector('.add')));el.querySelector('.del')?.addEventListener('click',async()=>{if(confirm('Delete this photo?')){try{await call('DELETE',{name:p.name});await load()}catch(e){alert(e.message)}}})})}async function signin(){try{const r=await fetch(API+'login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,pin:document.getElementById('pin').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Invalid login');auth=d;localStorage.setItem(KEY,JSON.stringify(d));document.getElementById('gate').classList.add('hide');load()}catch(e){document.getElementById('err').textContent=e.message}}document.getElementById('login').onclick=signin;try{auth=JSON.parse(localStorage.getItem(KEY)||'null');if(auth?.token){document.getElementById('gate').classList.add('hide');load()}}catch{}</script></body></html>
