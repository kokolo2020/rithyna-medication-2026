<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075d52"><title>Rithyna Therapy</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f2f7f6;color:#17383d}.app{max-width:1120px;margin:auto;padding:16px}.top{font-size:11px;font-weight:950;letter-spacing:.15em;color:#66817f;margin:8px 2px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.nav a{text-decoration:none;white-space:nowrap;padding:10px 13px;border-radius:13px;background:#fff;color:#42615f;border:1px solid #dbe8e6;font-weight:850}.nav a.on{background:#143f40;color:#fff}.hero{background:linear-gradient(135deg,#123f40,#087b70);color:#fff;border-radius:26px;padding:24px;box-shadow:0 16px 45px #00483d20}.hero h1{margin:0;font-size:clamp(27px,5vw,42px)}.hero p{margin:6px 0 0;color:#d8eeea}.switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.switch button{border:0;border-radius:18px;padding:16px;font-weight:950;font-size:15px;background:#fff;box-shadow:0 7px 24px #174b4510}.switch .pt.active{background:#2f6fb3;color:#fff}.switch .ot.active{background:#d85f89;color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 35px #174b4512;margin-bottom:15px}.pt-theme .card-title{color:#2f6fb3}.ot-theme .card-title{color:#c54c76}.card-title{font-size:19px;font-weight:950;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#71888c;font-weight:900;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #d8e6e4;border-radius:12px;padding:11px;font:inherit}.field textarea{min-height:90px;resize:vertical}.wide{grid-column:1/-1}.activities{display:flex;flex-wrap:wrap;gap:7px}.activity{border:1px solid #d7e5e3;border-radius:999px;padding:8px 11px;background:#fff;font-weight:850;color:#526c6a}.pt-theme .activity.on{background:#e8f2ff;color:#245f9e;border-color:#a9c8ea}.ot-theme .activity.on{background:#fde9f0;color:#a63d62;border-color:#efb3c8}.photo-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.photo-btn{border:1px solid #cbdedb;border-radius:12px;background:#f8fbfb;padding:10px 12px;font-weight:900}.photo-name{font-size:11px;color:#71888c}.save{width:100%;border:0;border-radius:14px;padding:13px;color:#fff;font-weight:950;font-size:15px}.pt-theme .save{background:#2f6fb3}.ot-theme .save{background:#d85f89}.history{display:grid;gap:10px}.session{border:1px solid #e0eae8;border-radius:17px;padding:13px}.session-head{display:flex;justify-content:space-between;gap:10px}.session strong{font-size:15px}.meta{font-size:11px;color:#71888c;margin-top:3px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.chip{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850;background:#edf4f3}.pt-theme .chip{background:#e8f2ff;color:#245f9e}.ot-theme .chip{background:#fce8ef;color:#a84064}.improve{margin-top:9px;font-size:13px;line-height:1.4}.photos{margin-top:9px}.photos a{font-size:11px;font-weight:900;color:#28706a;text-decoration:none}.delete{border:0;background:#fff1f1;color:#a33;border-radius:9px;padding:6px 8px;font-weight:850}.empty{color:#71888c;text-align:center;padding:28px}.version{text-align:right;font-size:10px;color:#829795;margin:8px 2px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero{padding:20px}.switch button{padding:13px 8px;font-size:13px}}</style></head><body><main class="app"><div class="top">RITHYNA · CARE 2026</div><nav class="nav"><a href="./index.html">Medication</a><a href="./blood-tests.html">Blood Tests</a><a href="./photos.html">Photos</a><a class="on" href="./therapy.html">Therapy</a></nav><section class="hero"><h1>Therapy Sessions</h1><p>Physical & Occupational Therapy progress journal</p></section><div class="version">v6.0 · Therapy Module</div><div class="switch"><button class="pt active" data-tab="pt">Physical Therapy</button><button class="ot" data-tab="ot">Occupational Therapy</button></div><section id="pt" class="panel pt-theme active"></section><section id="ot" class="panel ot-theme"></section></main><script>const API='/.netlify/functions/',KEY='rithyna-secure-session-v23',defs={pt:{title:'Physical Therapy',acts:['Stretching','Standing','Walking','Cycling','Yoga']},ot:{title:'Occupational Therapy',acts:['Mouth Exercises','Reading','Hands Games','Throwing Tennis Ball','Yoga','Stretching']}};let auth=null,sessions=[];function token(){return auth?.token||''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function call(path,method='GET',body){const r=await fetch(API+path,{method,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function form(type){const d=defs[type],el=document.getElementById(type);el.innerHTML=`<div class="card"><div class="card-title">${d.title} Session</div><div class="grid"><div class="field"><label>Date</label><input id="${type}Date" type="date"></div><div class="field"><label>Therapist name</label><input id="${type}Therapist" placeholder="Therapist name"></div><div class="field wide"><label>Activities · select one or more</label><div class="activities">${d.acts.map(a=>`<button type="button" class="activity" data-act="${esc(a)}">${esc(a)}</button>`).join('')}</div></div><div class="field wide"><label>Area to improve</label><textarea id="${type}Improve" placeholder="Progress, focus area or therapist recommendation…"></textarea></div><div class="field wide"><label>Session photos · up to 3</label><div class="photo-row"><button type="button" class="photo-btn">📷 Add Photos</button><span class="photo-name">No photos selected</span><input type="file" accept="image/*" multiple hidden></div></div><div class="wide"><button class="save">Save ${d.title} Session</button></div></div></div><div class="card"><div class="card-title">${d.title} History</div><div class="history"></div></div>`;el.querySelector(`#${type}Date`).value=new Date().toISOString().slice(0,10);el.querySelectorAll('.activity').forEach(b=>b.onclick=()=>b.classList.toggle('on'));const inp=el.querySelector('input[type=file]'),pb=el.querySelector('.photo-btn'),pn=el.querySelector('.photo-name');pb.onclick=()=>inp.click();inp.onchange=()=>{if(inp.files.length>3){alert('Maximum 3 photos per session.');inp.value='';return}pn.textContent=inp.files.length?`${inp.files.length} photo${inp.files.length>1?'s':''} ready`:'No photos selected'};el.querySelector('.save').onclick=()=>save(type,el,inp)}async function uploadPhotos(id,files){for(const file of files){if(file.size>6*1024*1024)throw Error('Each photo must be under 6 MB.');const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});await call('photo-api','POST',{entryId:id,name:file.name,type:file.type||'image/jpeg',data})}}async function save(type,el,inp){const btn=el.querySelector('.save'),date=el.querySelector(`#${type}Date`).value,therapist=el.querySelector(`#${type}Therapist`).value.trim(),activities=[...el.querySelectorAll('.activity.on')].map(x=>x.dataset.act),improve=el.querySelector(`#${type}Improve`).value.trim();if(!date||!therapist||!activities.length)return alert('Please add date, therapist and at least one activity.');btn.disabled=true;btn.textContent='Saving…';try{const d=await call('therapy-api','POST',{type,date,therapist,activities,improve});if(inp.files.length)await uploadPhotos(d.session.id,[...inp.files]);el.querySelector(`#${type}Therapist`).value='';el.querySelector(`#${type}Improve`).value='';el.querySelectorAll('.activity.on').forEach(x=>x.classList.remove('on'));inp.value='';el.querySelector('.photo-name').textContent='No photos selected';await load()}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='Save '+defs[type].title+' Session'}}async function load(){try{const d=await call('therapy-api');sessions=d.sessions||[];render()}catch(e){document.querySelectorAll('.history').forEach(x=>x.innerHTML='<div class="empty">'+esc(e.message)+'</div>')}}function render(){for(const type of ['pt','ot']){const h=document.querySelector(`#${type} .history`),arr=sessions.filter(x=>x.type===type);h.innerHTML=arr.length?arr.map(x=>`<article class="session"><div class="session-head"><div><strong>${new Date(x.date+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})} · ${esc(x.therapist)}</strong><div class="meta">Recorded by ${esc(x.recorded_by||'Care team')}</div></div>${auth?.role==='admin'?`<button class="delete" data-id="${esc(x.id)}">Delete</button>`:''}</div><div class="chips">${x.activities.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div>${x.improve?`<div class="improve"><b>Area to improve:</b> ${esc(x.improve)}</div>`:''}<div class="photos"><a href="./photos.html?entry=${encodeURIComponent(x.id)}">📷 View / add session photos</a></div></article>`).join(''):'<div class="empty">No sessions recorded yet.</div>';h.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(confirm('Delete this therapy session?')){try{await call('therapy-api','DELETE',{id:b.dataset.id});await load()}catch(e){alert(e.message)}}})}}document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});for(const t of ['pt','ot'])form(t);try{auth=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!auth?.token){alert('Please sign in from Medication first.');location.href='./index.html'}else load();</script></body></html>
